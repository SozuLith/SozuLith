<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="160"
     viewBox="0 0 800 160">

  <!-- TECHNOLOGY BADGES -->
  <g font-family="Arial, sans-serif"
     font-size="13"
     font-weight="600"
     letter-spacing="1.5"
     text-anchor="middle"
     fill="#C4D8F5">

    <!-- GO -->
    <rect x="273" y="14"
          width="64" height="36"
          rx="4" fill="#192B42"/>
    <text x="305" y="37">GO</text>

    <!-- PYTHON -->
    <rect x="345" y="14"
          width="110" height="36"
          rx="4" fill="#192B42"/>
    <text x="400" y="37">PYTHON</text>

    <!-- C -->
    <rect x="463" y="14"
          width="64" height="36"
          rx="4" fill="#192B42"/>
